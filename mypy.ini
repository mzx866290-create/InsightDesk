[mypy]
python_version = 3.12
namespace_packages = True
explicit_package_bases = True
mypy_path = .
warn_return_any = True
warn_unused_ignores = True
disallow_untyped_defs = False
ignore_missing_imports = True
exclude = tests/

# Existing type debt baseline.
# Keep this list explicit so newly added modules are still checked by CI, and
# remove entries incrementally as each package is made mypy-clean.
[mypy-backend.agent.agents.*]
ignore_errors = True

[mypy-backend.agent.approval,backend.agent.builder,backend.agent.builder_history,backend.agent.builder_wrappers,backend.agent.connection,backend.agent.dashboard_attachments,backend.agent.history,backend.agent.langgraph,backend.agent.orchestrator,backend.agent.orchestrator_metrics,backend.agent.providers.deepseek,backend.agent.providers.openai_compatible,backend.agent.registry,backend.agent.tool_registry,backend.agent.tools]
ignore_errors = True

[mypy-backend.agent_mcp_helpers,backend.api_server,backend.artifact_service,backend.chat_store,backend.deck_service,backend.doc_pipeline]
ignore_errors = True

[mypy-backend.core.config_runtime,backend.core.logging_config,backend.core.prompt_runtime,backend.core.router_registration,backend.core.runtime_metrics,backend.core.security_runtime,backend.core.session_summary_runtime,backend.core.task_runtime,backend.core.tracing]
ignore_errors = True

[mypy-backend.helpers.artifact_helpers,backend.helpers.deck_report_helpers,backend.helpers.document_helpers,backend.helpers.identity_helpers,backend.helpers.integration_connector_helpers,backend.helpers.kb_helpers,backend.helpers.model_config_helpers,backend.helpers.security_helpers,backend.helpers.session_helpers,backend.helpers.session_memory_helpers,backend.helpers.task_execution_helpers]
ignore_errors = True

[mypy-backend.stores.pg_chat_store,backend.stores.pg_resource_access_store,backend.stores.pg_task_store,backend.stores.vector_store,backend.tasks.worker]
ignore_errors = True

[mypy-search_runtime.providers.searxng_provider,search_runtime.registry,search_runtime.research_service,search_runtime.service]
ignore_errors = True
