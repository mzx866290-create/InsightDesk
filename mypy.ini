[mypy]
python_version = 3.12
namespace_packages = True
explicit_package_bases = True
mypy_path = .
warn_return_any = True
warn_unused_ignores = True
disallow_untyped_defs = False
ignore_missing_imports = True
exclude = tests/

# Existing type debt baseline.
# Keep this list explicit so newly added modules are still checked by CI, and
# remove entries incrementally as each package is made mypy-clean.
[mypy-backend.agent.agents.data_analysis,backend.agent.agents.integrator.agent,backend.agent.agents.integrator.audit,backend.agent.agents.integrator.execution,backend.agent.agents.model_compare,backend.agent.agents.reviewer,backend.agent.agents.writer]
ignore_errors = True

[mypy-backend.api_server,backend.chat_store]
ignore_errors = True
