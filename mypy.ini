[mypy]
python_version = 3.12
namespace_packages = True
explicit_package_bases = True
mypy_path = .
warn_return_any = True
warn_unused_ignores = True
disallow_untyped_defs = False
ignore_missing_imports = True
exclude = tests/

# Existing type debt baseline.
# Keep this list explicit so newly added modules are still checked by CI, and
# remove entries incrementally as each package is made mypy-clean.
