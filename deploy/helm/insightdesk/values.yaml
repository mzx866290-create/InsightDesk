replicaCount: 1

image:
  repository: insightdesk
  tag: latest
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  # NodePort/LoadBalancer require an explicit opt-in in the Service template.
  allowExternal: false
  port: 8000
  annotations: {}
  loadBalancerSourceRanges: []

config:
  reloadStrategy: rolloutOnConfigChange
  hotReload:
    enabled: false
    mountPath: /app/runtime/config
    fileName: insightdesk.env
    checkIntervalSeconds: "15"
  serverHost: 0.0.0.0
  serverPort: "8000"
  appDbPath: /app/runtime/chat_history.db
  vectorStorePath: /app/runtime/vector_store
  taskBackend: memory
  databaseProvider: sqlite
  vectorStoreProvider: faiss
  qdrantUrl: http://qdrant:6333
  qdrantCollection: insightdesk_kb
  ollamaBaseUrl: http://ollama:11434
  arqRedisHost: redis
  arqRedisPort: "6379"
  arqRedisDatabase: "0"
  arqQueueName: insightdesk:tasks
  arqWorkerMaxJobs: "4"
  arqKeepResultSeconds: "3600"
  arqCancelTimeoutSeconds: "5"

# Import sensitive runtime values from a pre-created Kubernetes Secret. Secret
# keys must match environment variable names, for example DATABASE_URL,
# REDIS_URL, OPENAI_API_KEY, SHARE_LINK_SECRET, or OIDC_CLIENT_SECRET.
secret:
  existingSecret: ""
  optional: false

# Non-sensitive entries or individual secretKeyRef entries. Do not put raw
# credentials in value fields because Helm values are stored in release history.
# TASK_BACKEND, POD_NAME, and ARQ_WORKER_HEARTBEAT_KEY are chart-managed and
# cannot be overridden here.
env: []
extraEnvFrom: []

pod:
  automountServiceAccountToken: false
  enableServiceLinks: false

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

runtime:
  persistence:
    enabled: true
    storageClassName: ""
    accessModes:
      - ReadWriteOnce
    size: 10Gi

api:
  terminationGracePeriodSeconds: 30
  lifecycle:
    preStop:
      exec:
        command:
          - sh
          - -c
          - sleep 5
  command:
    - sh
    - -lc
  args:
    - >-
      mkdir -p /app/runtime/vector_store
      && touch /app/runtime/chat_history.db
      && ln -sf /app/runtime/chat_history.db /app/chat_history.db
      && exec uvicorn backend.api_server:app --host "${SERVER_HOST}" --port "${SERVER_PORT}"
  resources: {}
  livenessProbe:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 20
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3
  startupProbe:
    httpGet:
      path: /healthz
      port: http
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 30
  readinessProbe:
    httpGet:
      path: /readyz
      port: http
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

worker:
  enabled: false
  replicaCount: 1
  terminationGracePeriodSeconds: 60
  lifecycle:
    preStop:
      exec:
        command:
          - sh
          - -c
          - sleep 5
  command:
    - sh
    - -lc
  args:
    - >-
      mkdir -p /app/runtime/vector_store
      && touch /app/runtime/chat_history.db
      && ln -sf /app/runtime/chat_history.db /app/chat_history.db
      && exec arq backend.tasks.worker.WorkerSettings
  resources: {}
  # Each Pod receives a unique ARQ heartbeat key. Startup/readiness check that
  # Pod-specific heartbeat;
  # liveness deliberately relies on the main process exit so a Redis outage
  # does not trigger a worker restart storm.
  startupProbe:
    exec:
      command:
        - arq
        - backend.tasks.worker.WorkerSettings
        - --check
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 30
  readinessProbe:
    exec:
      command:
        - arq
        - backend.tasks.worker.WorkerSettings
        - --check
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: false
  minAvailable: 1

networkPolicy:
  enabled: false
  api:
    enabled: true
    ingress:
      - from:
          # An empty podSelector matches only pods in this release namespace.
          - podSelector: {}
        ports:
          - protocol: TCP
            port: 8000
    egress:
      - to:
          - namespaceSelector: {}
        ports:
          - protocol: UDP
            port: 53
          - protocol: TCP
            port: 53
      - to:
          - podSelector:
              matchLabels:
                app.kubernetes.io/name: redis
        ports:
          - protocol: TCP
            port: 6379
      - to:
          - podSelector:
              matchLabels:
                app.kubernetes.io/name: qdrant
        ports:
          - protocol: TCP
            port: 6333
      - to:
          - podSelector:
              matchLabels:
                app.kubernetes.io/name: postgres
        ports:
          - protocol: TCP
            port: 5432
  worker:
    enabled: true
    ingress: []
    egress:
      - to:
          - namespaceSelector: {}
        ports:
          - protocol: UDP
            port: 53
          - protocol: TCP
            port: 53
      - to:
          - podSelector:
              matchLabels:
                app.kubernetes.io/name: redis
        ports:
          - protocol: TCP
            port: 6379
      - to:
          - podSelector:
              matchLabels:
                app.kubernetes.io/name: qdrant
        ports:
          - protocol: TCP
            port: 6333
      - to:
          - podSelector:
              matchLabels:
                app.kubernetes.io/name: postgres
        ports:
          - protocol: TCP
            port: 5432
  dependencies:
    redis:
      enabled: true
      podSelector:
        matchLabels:
          app.kubernetes.io/name: redis
      ingress:
        - from:
            - podSelector:
                matchLabels:
                  app.kubernetes.io/component: api
            - podSelector:
                matchLabels:
                  app.kubernetes.io/component: worker
          ports:
            - protocol: TCP
              port: 6379
      egress: []
    qdrant:
      enabled: true
      podSelector:
        matchLabels:
          app.kubernetes.io/name: qdrant
      ingress:
        - from:
            - podSelector:
                matchLabels:
                  app.kubernetes.io/component: api
            - podSelector:
                matchLabels:
                  app.kubernetes.io/component: worker
          ports:
            - protocol: TCP
              port: 6333
      egress: []
    postgres:
      enabled: true
      podSelector:
        matchLabels:
          app.kubernetes.io/name: postgres
      ingress:
        - from:
            - podSelector:
                matchLabels:
                  app.kubernetes.io/component: api
            - podSelector:
                matchLabels:
                  app.kubernetes.io/component: worker
          ports:
            - protocol: TCP
              port: 5432
      egress: []
