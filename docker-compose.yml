x-backend-env: &backend-env
  SERVER_HOST: 0.0.0.0
  SERVER_PORT: 8000
  APP_DB_PATH: /app/runtime/chat_history.db
  CHAT_HISTORY_DB_PATH: /app/runtime/chat_history.db
  VECTOR_STORE_PATH: /app/runtime/vector_store
  DOCUMENT_UPLOAD_STAGING_DIR: ${DOCUMENT_UPLOAD_STAGING_DIR:-/app/runtime/upload_staging}
  OLLAMA_BASE_URL: ${DOCKER_OLLAMA_BASE_URL:-http://ollama:11434}
  SEARXNG_URL: ${DOCKER_SEARXNG_URL:-}
  TASK_BACKEND: ${TASK_BACKEND:-memory}
  REDIS_URL: ${DOCKER_REDIS_URL:-redis://redis:6379/0}
  ARQ_QUEUE_NAME: ${ARQ_QUEUE_NAME:-insightdesk:tasks}
  ARQ_WORKER_MAX_JOBS: ${ARQ_WORKER_MAX_JOBS:-4}
  ARQ_KEEP_RESULT_SECONDS: ${ARQ_KEEP_RESULT_SECONDS:-3600}
  DATABASE_PROVIDER: ${DATABASE_PROVIDER:-sqlite}
  DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/insightdesk}
  VECTOR_STORE_PROVIDER: ${VECTOR_STORE_PROVIDER:-faiss}
  QDRANT_URL: ${DOCKER_QDRANT_URL:-http://qdrant:6333}
  QDRANT_API_KEY: ${QDRANT_API_KEY:-}
  QDRANT_COLLECTION: ${QDRANT_COLLECTION:-insightdesk_kb}

x-backend-service: &backend-service
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - .env
  volumes:
    - ./runtime:/app/runtime
  restart: unless-stopped

services:
  api:
    <<: *backend-service
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      <<: *backend-env
    depends_on:
      ollama:
        condition: service_healthy
    command: >
      sh -lc "mkdir -p /app/runtime/vector_store /app/runtime/upload_staging
      && touch /app/runtime/chat_history.db
      && ln -sf /app/runtime/chat_history.db /app/chat_history.db
      && uvicorn backend.api_server:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health').read()\"",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    <<: *backend-service
    profiles: ["tasks"]
    environment:
      <<: *backend-env
      TASK_BACKEND: arq
      TASK_STORE_FAIL_INCOMPLETE_ON_START: "false"
    depends_on:
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    command: >
      sh -lc "mkdir -p /app/runtime/vector_store /app/runtime/upload_staging
      && touch /app/runtime/chat_history.db
      && ln -sf /app/runtime/chat_history.db /app/chat_history.db
      && arq backend.tasks.worker.WorkerSettings"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import os, socket; from urllib.parse import urlparse; u=urlparse(os.getenv('REDIS_URL','redis://redis:6379/0')); s=socket.create_connection((u.hostname or 'redis', u.port or 6379), 3); s.close()\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    profiles: ["tasks"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    profiles: ["storage"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-insightdesk}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    profiles: ["storage"]
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:6333/readyz >/dev/null || wget -q -O - http://127.0.0.1:6333/readyz >/dev/null",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest
    profiles: ["search"]
    ports:
      - "${SEARXNG_PORT:-8080}:8080"
    volumes:
      - ./config/searxng/settings.yml:/etc/searxng/settings.yml:ro
      - ./runtime/searxng/data:/var/cache/searxng

  ollama-pull:
    image: ollama/ollama:latest
    profiles: ["init"]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5-2B:latest}
    entrypoint: ["/bin/sh", "-lc"]
    command: >
      until ollama list >/dev/null 2>&1; do sleep 2; done;
      ollama pull "$${OLLAMA_MODEL}"
    restart: "no"

volumes:
  ollama_data:
  postgres_data:
  qdrant_data:
